<!-- This code is manually entered on the ontraport page -->
<!-- https://app.ontraport.com/#!/landing_page/edit&id=557 -->
<style>
  .hidden {
    display: none;
  }
</style>
<script>
  const opDataBlockId = "oea9438f9d9eb";
  const blueprintURL = "https://devtrapz.github.io/cie-blueprint-app/";

  document.addEventListener("DOMContentLoaded", loadBlueprint);

  function loadBlueprint() {
    const rawData = extractData(opDataBlockId);
    if (!rawData) {
      console.error("Failed to extract raw data. Aborting blueprint load.");
      return;
    }
    const data = validateData(rawData);
    if (!data) {
      console.error("Failed to validate data. Aborting blueprint load.");
      return;
    }

    const iframe = createIframe(blueprintURL);
    iframe.addEventListener("message", () => {
      iframe.contentWindow.postMessage(data, blueprintURL);
    });
  }

  function extractData(opDataBlockId) {
    const dataBlock = document.getElementById(opDataBlockId);
    if (!dataBlock) {
      console.error(
        "Ontraport is missing the data block. Block id:" + opDataBlockId,
      );
      return null;
    }
    const dataElement = dataBlock.getElementsByClassName("opt-text-wrapper");
    if (!dataElement || dataElement.length === 0) {
      console.error(
        "Ontraport is missing the data structure. Block id:" + opDataBlockId,
      );
      return null;
    }
    const rawData = dataElement[0].textContent;

    return rawData;
  }
  function validateData(rawData) {
    if (!rawData) {
      console.error("Raw data is missing or empty.");
      return null;
    }

    const regexRemoveSpaces = /\s+(?=(?:(?:[^\"]*\"){2})*[^\"]*$)|/;
    const regexRemoveNBSP = /\u00A0/g;
    const dataJSON = rawData
      .replace(regexRemoveNBSP, "")
      .replace(regexRemoveSpaces, "")
      .replace(/</g, "[")
      .replace(/>/g, "]");

    try {
      const data = JSON.parse(dataJSON);
      return data;
    } catch (error) {
      console.error("Data structure is not valid JSON:", error);
      return null;
    }
  }
  function createIframe(url) {
    const iframe = document.createElement("iframe");

    iframe.src = url;
    iframe.title = "Blueprint";
    iframe.width = "1550px";
    iframe.height = "1400px";

    document.body.prepend(iframe);
    return iframe;
  }
</script>
